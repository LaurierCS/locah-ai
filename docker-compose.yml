services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: locah
      POSTGRES_PASSWORD: locah
      POSTGRES_DB: locah
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locah"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
