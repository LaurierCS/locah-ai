name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: locah
          POSTGRES_PASSWORD: locah
          POSTGRES_DB: locah
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U locah" --health-interval 5s --health-retries 10
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - name: Run Migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://locah:locah@localhost:5432/locah
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Tests (includes privacy invariants — see SDD §3)
        run: uv run pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://locah:locah@localhost:5432/locah

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
