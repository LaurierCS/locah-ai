name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: locah
          POSTGRES_PASSWORD: locah
          POSTGRES_DB: locah
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U locah" --health-interval 5s --health-retries 10
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Typecheck
        run: mypy
      - name: Tests (includes privacy invariants — see SDD §3)
        run: pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://locah:locah@localhost:5432/locah

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci || npm install
      - run: npm run lint --if-present
      - run: npx tsc --noEmit || true
