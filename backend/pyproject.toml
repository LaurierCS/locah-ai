[project]
name = "locah"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128",
  "uvicorn[standard]>=0.53.0",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "sqlalchemy>=2.0.54",
  "psycopg[binary]>=3.3.6",
  "pgvector>=0.4",
  "alembic>=1.16",
  "anthropic>=1.7.0",
  "httpx>=0.28",
  "trafilatura>=2.0",
  "pypdf>=6.0",
  "scikit-learn>=1.7",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.16.8",
  "mypy>=1.17",
  "respx>=0.22",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app/core", "app/llm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
